# Local stack that mirrors production (Postgres like Neon, gunicorn like Render).
#   docker compose up --build   ->  http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stockapp
      POSTGRES_USER: stockapp
      POSTGRES_PASSWORD: stockapp
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockapp -d stockapp"]
      interval: 2s
      retries: 20

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://stockapp:stockapp@db:5432/stockapp
      DJANGO_DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
