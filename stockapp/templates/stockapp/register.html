{% extends "stockapp/base.html" %}

{% block title %}Create account{% endblock %}

{% block auth_content %}
<div class="eyebrow">Open a workspace</div>
<h2>Create your account</h2>
<p class="lede">Save portfolios and pick up your analysis where you left off.</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-block">
        Create account
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
</form>
<p class="switch">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
